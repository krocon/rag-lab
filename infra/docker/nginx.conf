# Serves the Angular app and proxies /api to the API container ("api" in docker-compose.yml).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Compress text assets and JSON. text/event-stream is deliberately not listed: compressing SSE
  # would buffer the chat stream.
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Container health check (Dockerfile HEALTHCHECK); does not depend on the API.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    # API responses keep the API's own security headers (helmet, see docs/security.md); the
    # web headers are not added here, so there are no duplicate or conflicting policies.
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    # Browser's Host including the port: the API's same-origin check compares it with Origin.
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-Sent Events (POST /api/chat) must reach the browser token by token: no response
    # buffering or caching. proxy_read_timeout is the longest pause between two bytes from the API
    # (the API's CHAT_TIMEOUT_MS idle timeout defaults to 120 s, so 300 s leaves headroom).
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Uploads are streamed to the API instead of being written to a temporary file first; the API
    # enforces its own limits and REQUEST_TIMEOUT_MS.
    proxy_request_buffering off;
    # nginx defaults to 1 MiB; the API caps one upload request at MAX_UPLOAD_REQUEST_BYTES
    # (default 100 MiB) itself. Raise this together with that setting.
    client_max_body_size 101m;
  }

  # Build output with a content hash in the file name (outputHashing "all" in angular.json,
  # e.g. main-JSAOKNQN.js, chunk-BS-JqRcW.js, media/font-AB12CD34.woff2): cache for a year.
  location ~ "^/(?:media/)?[A-Za-z0-9_.]+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$" {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Everything else (index.html, favicon, SPA routes): revalidate on every load, so a new release
  # is picked up immediately.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    # SPA fallback: client-side routes such as /chat are answered with index.html.
    try_files $uri $uri/ /index.html;
  }
}
