# Security headers of the web app (docs/security.md §5), included in every location that serves
# the Angular app. nginx only inherits add_header from the server level when a location defines
# none itself, so locations that add Cache-Control include this file instead.
#
# The Angular build loads scripts and stylesheets from its own origin only (critical-CSS inlining is
# disabled in angular.json, so no inline script is needed); Angular adds component styles at
# runtime, hence 'unsafe-inline' for styles only. connect-src 'self': the app talks to /api on
# this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
