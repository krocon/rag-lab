# RAGLab local development stack.
#
#   docker compose up -d                     → PostgreSQL + pgvector only (default)
#   docker compose --profile app up -d --build   → additionally API + web app in containers
#   docker compose --profile ollama up -d    → additionally Ollama in a container (Linux/NVIDIA;
#                                              on macOS run Ollama natively for GPU access)
#
# All credentials come from `.env` (see .env.example).

name: raglab

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory below /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      CORS_ORIGINS: http://localhost:8080
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set EMBEDDING_MODEL in .env}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:?set EMBEDDING_DIMENSIONS in .env}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-ollama}
      CHAT_MODEL: ${CHAT_MODEL:?set CHAT_MODEL in .env}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-8}
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'

  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  ollama-data:
